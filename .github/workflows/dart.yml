name: Flutter Release Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step to check out your repository
      - uses: actions/checkout@v4

      # Set up Flutter environment (replace with specific version if needed)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.3

      # Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # Run static code analysis
      - name: Analyze code
        run: flutter analyze

      # Build the APK for release
      - name: Build APK
        run: flutter build apk --release

      # Upload the APK as an artifact (Optional for debugging or CI validation)
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      # Check out the repository
      - uses: actions/checkout@v4

      # Set up Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      # Build the APK again for the release
      - name: Build APK
        run: flutter build apk --release

      # Create a GitHub release and attach the APK
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true

      # Upload the APK to the release
      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/app/outputs/flutter-apk/app-release.apk
          asset_name: app-release.apk
          asset_content_type: application/vnd.android.package-archive
